id: tool-mhg-treetagger-pos-tagger
name: POS Tagger for Middle High German Texts
aliases:
  - POS Tagger für mittelhochdeutsche Texte
  - Middle High German TreeTagger parameter file
description: A Middle High German part-of-speech tagging resource provided as a TreeTagger parameter file trained on a POS-tagged version of the Middle High German Conceptual Database.
reviewed_on: 2026-08-12
links:
  homepage: https://www.ims.uni-stuttgart.de/en/research/resources/tools/pos-tag-mhg/
  download: https://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/middle-high-german.par.gz
  web_application: http://clarin05.ims.uni-stuttgart.de/mhdtt/index.html
  treetagger: https://cis.uni-muenchen.de/~schmid/tools/TreeTagger/
  citation: https://doi.org/10.5281/zenodo.4646130

tasks: [pos_tagger]
supported_stages: [mhg]

access:
  availability: [described, downloadable]
  model_training: unclear
  original_data_redistribution: unclear
  processed_data_redistribution: unclear
  trained_weight_publication: unclear
  note: The reviewed pages describe and link the MHG parameter file, but provide no exact direct legal wording for the four separately modeled permissions. The linked web application was not asserted as currently browsable.
  source_ids: [evidence-mhg-pos-tagger-stuttgart, evidence-mhg-pos-tagger-treetagger]

training_data:
  - Middle High German Conceptual Database (Mittelhochdeutsche Begriffsdatenbank)

note: This record represents the MHG TreeTagger parameter resource and associated institutional interface, not the TreeTagger runtime itself and not RNNTagger.

