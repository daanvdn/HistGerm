    title: POS Tagger for Middle High German Texts
    quote: The parameter file for TreeTagger has been created by training on a POS tagged version of the Mittelhochdeutsche Begriffsdatenbank. This annotation has been achieved semi-automatically by an automatic mapping of the grammatical annotation included in the database to Universal Dependencies POS tags based on manually annotated parts of the texts.
    note: The page links both a web application and an MHD-TreeTagger parameter file.

