citation_detail: >-
  Articles identify works, research-relevant editions, and passages through
  source sigla and cited locations. Source sigla link to bibliography records,
  and cited locations can link to fuller electronic text context. The inspected
  evidence did not establish page- and line-level detail for all citations.
note: >-
  The MWB is an epoch dictionary for high-medieval German-language texts from
  1050–1350 (source wording: “1050 bis 1350”) and covers Middle High German with
  German target descriptions. It is hosted by the Akademie der Wissenschaften
  und der Literatur Mainz and the Niedersächsische Akademie der Wissenschaften
  zu Göttingen, both in the role of host institution. The reviewed online
  publication state is a–merhensun. The publication-status page describes this
  extent as “rund 27.400 Artikel” (approximately 27,400 articles); this is a
  qualified note, not an exact size. MWB Online provides a browsable HTML
  interface. Its documented search covers the lemma list, word-form list,
  bibliography, and published article headwords including lemma variants;
  character-sequence search supports optional truncation. Users can retrieve
  concordances, vary left and right context length, resolve source sigla to
  bibliography records, and follow cited locations to fuller electronic text
  context. Complete headword lists and search-result lists are provided with
  associated addresses, supporting persistent article linking. The electronic
  evidence archive assigns text word forms to normalized lemmata with documented
  error tolerance, especially for hidden homographs and some high-frequency
  vocabulary. These facts may support investigation of lemmatization and
  dictionary variants, but documented lemmatization errors, the lack of a
  verified bulk machine-readable download, unclear model-training permission,
  and unverified transcription conventions remain limitations; no suitability
  verdict is retained. Corpus-occurrence and context links are available, but no
  verified HistGerm corpus identifier or link unit was established. The
  Wörterbuchnetz Open API exposes machine-readable JSON encoded as UTF-8. A
  lemma-pattern request such as /lemmata/abe returns the dictionary siglum,
  lemma, grammatical label, Wörterbuchnetz identifier, book reference, and an
  addressable entry result. The inspected response was structured JSON; no
  dictionary payload was downloaded. The API services are freely accessible
  without authentication, but this does not establish bulk-download, reuse,
  redistribution, model-training, or trained-weight-publication permission.
  API parameters, output, and continuous availability may change. The source
  edition is “Mittelhochdeutsches Wörterbuch. Band 1: a–êvrouwe”, a dictionary
  volume edited by Kurt Gärtner, Klaus Grubmüller, and Karl Stackmann, published
  in Stuttgart by S. Hirzel in 2013, ISBN-13 9783777623276. Full citation:
  “Gärtner, Kurt; Grubmüller, Klaus; Stackmann, Karl (eds.).
  Mittelhochdeutsches Wörterbuch. Band 1: a–êvrouwe. Stuttgart: S. Hirzel, 2013.
  ISBN 978-3-7776-2327-6.” No complete ISO publication date was established.
  Later printed installments are published online after a six-month protection
  period.

