notes:
- The MHG component covers 1050-1350 and is described as 43 texts selected from ReM, approximately 295,000 words.
- The ENHG component covers 1350-1650 and is described as 61 texts selected mostly from ReF.
- IPCHG says its source texts are adapted from ReM, ReF, and DTA while the syntactic parsing is its own; no whole-corpus duplicate
  or structured overlap is asserted.
- The corpus continues into New High German (1650-1950), which is outside the HistGerm stage enum.
