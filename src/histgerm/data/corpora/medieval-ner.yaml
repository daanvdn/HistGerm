notes:
- Only the explicitly named Middle High German component, Nibelungenlied, contributes to covered_stages. Medieval Latin and
  Old Norse are retained in the description rather than mapped to HistGerm historical-German stages.
- The resource is represented as the deposited multilingual lemma/token named-entity dataset, not as a full-text Nibelungenlied
  corpus or edition.
- A shared Nibelungenlied work title with corpus-rem:m321 is insufficient to assert structured overlap without edition or
  witness identity.
