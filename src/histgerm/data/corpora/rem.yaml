  title: ReM M330 canonical details
  note: 'M330: text date “um 1200 / 13,1V”; manuscript date “13,M”; text composition “vermutl. wmd. (rhfrk.-hess.?)”; manuscript/script
    dialect “hessisch-thüringisch?”; ANNIS group “13_1-thurhess-PV-G”.'
