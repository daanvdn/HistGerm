  title: ReM corpus structure documentation
  quote: Im Referenzkorpus Mittelhochdeutsch (ReM) sind mehrere Korpora zusammengeflossen.
  note: Supports component identity and provenance, -G MiGraKo and -X extension membership, diplomatic transcription, tok_dipl,
    and tok_anno. It does not establish a safe whole-corpus derivation edge.
