  - texts.note
  title: ReM metadata field documentation
  quote: 'language: Sprachstufe (in ReM steht ''mhd'')'
  note: Defines text and manuscript metadata fields and verifies Middle High German for every ReM text.
- id: evidence-rem-lemma
  url: https://linguistics.rub.de/rem/documentation/lemma.html
  accessed_on: '2026-08-11'
  supports:
  - annotations.lemma
  title: ReM lemma documentation
  quote: Die Gestaltung der Lemmaansätze und die Bestimmung der grammatischen Kategorien richtet sich dabei meist nach dem
    jeweils entsprechenden Ansatz in Lexers Handwörterbuch.
  note: Supports Lexer-based lemma conventions and the lemma, lemmaLemma, and lemmaId ANNIS layers.
- id: evidence-rem-pos
  url: https://linguistics.rub.de/rem/documentation/pos.html
  accessed_on: '2026-08-11'
  supports:
  - annotations.pos
  title: ReM part-of-speech documentation
  quote: Wortarten sind mit HiTS („Historisches Tagset") annotiert, das im Kontext der Projekte „Referenzkorpus Altdeutsch"
    und „Referenzkorpus Mittelhochdeutsch" entstanden ist.
  note: Supports the HiTS name and token-specific pos and lemma-specific posLemma layers.
- id: evidence-rem-morphology
  url: https://linguistics.rub.de/rem/documentation/morph.html
  accessed_on: '2026-08-11'
  supports:
  - annotations.morphology
  title: ReM morphology documentation
  quote: Morphologische Informationen sind als einzelnes Merkmal annotiert, dessen Werte jeweils mit einem Punkt voneinander
    abgetrennt sind (Bsp. Masc.Nom.Sg für 'Maskulinum Nominativ Singular').
  note: Supports the ReM-internal inflection feature grammar and its dot-separated values.
