  title: ReM annotation layers documentation
  quote: char_align ist für das Kernkorpus, d.h. für alle MiGraKo-Texte, annotiert, aber nur für einen kleinen Teil der Texte
    im Erweiterungskorpus.
  note: Supports layer identities, token alignment, missing-value convention, norm and char_align formats, tokenization tags,
    unequal component coverage, and sentence segmentation.
