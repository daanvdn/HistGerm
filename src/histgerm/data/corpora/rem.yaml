    Mittelhochdeutsch (1050–1350), Version 2.1. ISLRN 937-948-254-174-0. https://doi.org/10.5281/zenodo.13982324
  quote: Texts have been digitized and richly annotated, e.g. with parts of speech, morphology and lemmas.
  note: Public Zenodo release page for version 2.1, publication date, creators, DOI, ISLRN, listed downloads and sizes, format
