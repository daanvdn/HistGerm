  annotations:
  - id: lemma
    type: lemma
    tagset_name: Lexers Mittelhochdeutsches Handwörterbuch (Lexer)
    tagset_link: http://woerterbuchnetz.de/Lexer/
    source_ids:
    - evidence-rem-layers
    - evidence-rem-lemma
    note: 'Token-specific lemma (ANNIS: lemma) and lemma-specific lemma (ANNIS: lemmaLemma). Lemma conventions follow Lexer.
      lemmaId cross-references the Mittelhochdeutsches Wörterbuch. Missing or empty entries are represented by --. Applies
      corpus-wide; no text-level exception is documented.'
  - id: pos
    type: pos
    tagset_name: HiTS (Historisches Tagset)
    tagset_link: https://linguistics.rub.de/comphist/resources/hits/
    source_ids:
    - evidence-rem-pos
    - evidence-rem-hits
    - evidence-rem-hits-publication
    note: 'Token-specific POS (ANNIS: pos) and lemma-specific POS (ANNIS: posLemma). HiTS adapts STTS for historical German.
      No HiTS version is assigned in ReM documentation. Missing or empty entries are represented by --. Applies corpus-wide;
      no text-level exception is documented.'
  - id: morphology
    type: morphology
    source_ids:
    - evidence-rem-layers
    - evidence-rem-morphology
    note: 'ReM-internal feature grammar: ANNIS inflection uses dot-separated combinations such as Masc.Nom.Sg; inflectionClass
      and inflectionClassLemma hold token- and lemma-specific classes. Underspecified features use *. No external named tagset.
      Missing or empty entries are represented by --. Applies corpus-wide.'
  - id: normalization
    type: normalization
    source_ids:
    - evidence-rem-layers
    note: 'MHG normal form of each token (ANNIS: norm), following standard MHG dictionary conventions. Missing or empty entries
      are represented by --. Applies corpus-wide; no text-level exception is documented.'
  - id: char-align
    type: normalization
    source_ids:
    - evidence-rem-layers
    note: 'Graphophonemic character-by-character alignment (ANNIS: char_align) from attested form to norm; pipe-separated
      mappings use x=u notation. It is assigned here to every MiGraKo (-G) text. A verified small but unidentified subset
      of extension (-X) texts also has char_align; those extension assignments are omitted until text-level evidence exists.'
  - id: tokenization
    type: other
    source_ids:
    - evidence-rem-layers
    - evidence-rem-hits
    - evidence-rem-hits-publication
    note: 'Tokenization change annotation (ANNIS: tokenization) records differences between tok_anno and tok_dipl. HiTS tags
      MS, ML, US, and UL and numbered variants describe changes; unchanged tokens carry --. Applies corpus-wide as a presence
      layer.'
