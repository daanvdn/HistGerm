  title: ReM project homepage
  quote: 'The “Reference Corpus of Middle High German” (short: ReM) is a corpus of diplomatically transcribed and annotated
    texts from Middle High German (1050–1350) with a size of around 2 million word forms.'
  note: Canonical bilingual project description for identity, short name, stage, chronology, transcription, and approximate
    size.
