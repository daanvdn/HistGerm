  note: 'Version 2.1 is not superseded. It contains exactly 406 canonical texts. MiGraKo is the structurally sampled core
    inherited from the Corpus of Middle High German Grammar; the ReM extension corpus was created by the project and contains
    additional texts and passages. Components remain facts in notes, not synthetic texts. The distribution is a dataset-repository
    ZIP release with separate TEI-compatible XML, Tabular JSON, CorA-XML, and GraphML archives and linked schemas. TEI naming
    caveat: the TEI lemma attribute contains ANNIS norm, while the TEI norm attribute contains ANNIS tok_anno. The v2.1 changelog
    corrected punctus elevatus parser handling and outdated file-header metadata. texts.html retains a stale M057 row, but
    NEWS says “Removed: M057” and the complete v2.1 CorA-XML container manifest includes M056.xml and M058.xml but no M057.xml;
    M057 is therefore excluded. char_align is present for every MiGraKo text and for a small unidentified extension subset;
    only verified MiGraKo assignments are represented. No safe overlap or whole-corpus derivation is asserted.'
notes:
- 'Creators (persons, role creator): Adam Roussel, Thomas Klein, Stefanie Dipper, Klaus-Peter Wegera, and Claudia Wich-Reif.'
- ReM is diplomatically transcribed. tok_dipl preserves historical tokenization and letter representation close to historical
  forms; tok_anno uses modernized tokenization and simplified spelling. The punc layer marks sentence or segment boundaries
  with functional boundary tags.
- Several corpora flowed into ReM. This does not support a whole-corpus derived_from relationship, so no structured overlap
  is asserted.
