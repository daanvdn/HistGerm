  title: Projekt - Mittelhochdeutsches Wörterbuch
  quote: das deutsch-amerikanische Kooperationsprojekt Digitales Mittelhochdeutsche Textarchiv / Digital Middle High German
    Text Archive, in dem einige Quellentexte für das digitale Volltextarchiv des MWBs digitalisiert wurden
  note: Supports a source-text relationship with the separately retained MWB Textarchiv, without establishing duplicate identity
    or exact member overlap.
- id: evidence-dmgh-mhdbdb-comparison
