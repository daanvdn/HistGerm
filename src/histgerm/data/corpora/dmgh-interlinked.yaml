notes:
- 'D-MHGTA is retained separately from corpus-mwb-textarchiv: MWB documentation describes it as a cooperation project contributing
  some source texts to the MWB archive, not as the archive itself.'
- 'D-MHGTA is not merged with corpus-mhdbdb: institutional metadata identifies MHDBDB as a separately named University of
  Salzburg corpus with semantic annotations, while no text-level overlap evidence was established.'
