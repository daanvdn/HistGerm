  title: MHDBDB TEI Repository - Paris-Lodron-University Salzburg
  quote: TEI-encoded Middle High German literature texts with semantic annotations and web-based exploration interface from
    the Mittelhochdeutsche Begriffsdatenbank (MHDBDB), University of Salzburg.
  note: Comparison evidence identifies MHDBDB as a separately named Salzburg corpus; shared MHG and TEI characteristics are
    not treated as identity or text overlap.
