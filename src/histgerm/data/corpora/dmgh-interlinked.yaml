id: corpus-dmgh-interlinked
name: Digital Middle High German Inter-Linked
aliases:
- Digitales Mittelhochdeutsches Textarchiv
description: An American-German cooperation project that digitized philologically reliable Middle High German texts from standard
  academic editions, encoded them according to TEI standards in XML, and presented the text archive through separate Trier
  and American interfaces.
links:
  project_overview: https://tcdh.uni-trier.de/en/projekt/digital-middle-high-german-inter-linked
  historical_project_website: http://www.mhgta.uni-trier.de/
