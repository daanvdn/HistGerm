  title: Digital Middle High German Inter-Linked | Trier Center for Digital Humanities
  quote: The aim of the American-German cooperation project "Digital Middle High German Inter-linked / Digitales Mittelhochdeutsches
    Textarchiv" was to provide an extensive collection of Middle High German texts on the Internet that are based on the standard
    academic editions and are philologically reliable.
  note: Responsible project documentation identifies the corpus, explicit stage, bilingual name, TEI/XML work, interfaces,
    historical project website, and 2001–2003 running time.
