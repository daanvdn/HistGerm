- ReM documentation places MiGraKo material in corpus-rem, and the BAdW publication descends from the same DFG Middle High
  German Grammar project, but exact release-level identity and the extent of subsequent improvements are not directly established;
  no overlap edge is asserted.
- 'This corpus is not merged with corpus-mwb-textarchiv or dictionary-mwb: the trusted MWB records represent a separately
  named text-archive component and a dictionary, while this resource is the maintained publication of a corpus created for
  the DFG Middle High German Grammar project.'
