id: corpus-badw-mhg
name: Mittelhochdeutsch-Korpus
description: A handschriftentreu transcribed corpus of approximately 1.1 million word forms from more than 100 temporally
  and geographically distributed Middle High German texts, with lexical, morphological, morphosyntactic, and graphonological
  annotation.
