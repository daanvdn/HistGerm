[project]
name = "histgerm"
version = "0.1.0"
description = "A curated inventory and Python library for Historical German language resources"
readme = "README.md"
authors = [
    { name = "Daan Van den Nest", email = "daanvdn@gmail.com" }
]
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "historical-german",
    "historical-linguistics",
    "language-resources",
    "metadata",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11,<3",
    "PyYAML>=6.0.2,<7",
]

[project.urls]
Repository = "https://github.com/daanvdn/HistGerm"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "docs/**",
    "inventory/**",
    "tests/**",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
exclude = ["docs/**/*.md"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=histgerm",
    "--cov-branch",
    "--cov-report=term-missing",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["histgerm"]

[tool.coverage.report]
show_missing = true
