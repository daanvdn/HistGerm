name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON_DOWNLOADS: never

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.2"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Disable network access for checks
        run: echo "UV_OFFLINE=1" >> "$GITHUB_ENV"

      - name: Validate discovery ledger
        run: uv run python -m histgerm.research validate --ledger research/discovery-ledger.yaml --format json

      - name: Validate inventory
        run: uv run python -m histgerm.validation src/histgerm/data

      - name: Test
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Check whitespace errors
        run: git diff --check
