  resource_id: corpus-altdeutsche-originalurkunden
  disposition_reason: Added as a distinct corpus. Canonical TCDH evidence identifies
    the Corpus der altdeutschen Originalurkunden bis zum Jahr 1300 and explicitly
    describes it as central to Middle High German research; OHG and ENHG are not claimed.
    Its unversioned online edition was publicly browsable on 2026-08-12, while the
    latest visible functionality-news item is dated 2007-06-05 and is not misrepresented
    as a release. No identity match with corpus-rem was established, all legal permissions
    remain unclear, and no payload was retrieved.
  evidence_gaps:
  - The canonical pages do not state a numbered release, release label, or release
    date; the proposed version therefore represents the live unversioned online edition
    and does not convert the 2007 functionality-news date into a release date.
  - No canonical statement directly establishes OHG or ENHG coverage; only MHG is
    claimed from the explicit project statement.
  - No canonical legal terms directly support any modeled reuse or training permission,
    so all four permissions remain unclear.
  - Individual corpus texts and annotation layers were not enumerated from the metadata-only
    pages and no corpus payload was accessed.
