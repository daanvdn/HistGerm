candidates:
- id: candidate-corpus-altdeutsche-originalurkunden
  name: Corpus der altdeutschen Originalurkunden bis zum Jahr 1300
  category: corpus
  discovered_on: '2026-08-12'
  last_checked_on: '2026-08-12'
  discovery_urls:
  - https://tcdh.uni-trier.de/en/projekt/digitization-corpus-altdeutscher-originalurkunden
  discovery_stage_claims:
  - mhg
  disposition: added
  resource_id: corpus-altdeutsche-originalurkunden
  disposition_reason: Added as a distinct corpus. Canonical TCDH evidence identifies
    the Corpus der altdeutschen Originalurkunden bis zum Jahr 1300 and explicitly
    describes it as central to Middle High German research; OHG and ENHG are not claimed.
    Its unversioned online edition was publicly browsable on 2026-08-12, while the
    latest visible functionality-news item is dated 2007-06-05 and is not misrepresented
    as a release. No identity match with corpus-rem was established, all legal permissions
    remain unclear, and no payload was retrieved.
  evidence_gaps:
  - The canonical pages do not state a numbered release, release label, or release
    date; the proposed version therefore represents the live unversioned online edition
    and does not convert the 2007 functionality-news date into a release date.
  - No canonical statement directly establishes OHG or ENHG coverage; only MHG is
    claimed from the explicit project statement.
  - No canonical legal terms directly support any modeled reuse or training permission,
    so all four permissions remain unclear.
  - Individual corpus texts and annotation layers were not enumerated from the metadata-only
    pages and no corpus payload was accessed.
  refreshed_existing: false
- id: candidate-corpus-badw-mhg
  name: Mittelhochdeutsch-Korpus
  category: corpus
  discovered_on: '2026-08-12'
  last_checked_on: '2026-08-12'
  discovery_urls:
  - https://github.com/badw-dh/Mittelhochdeutsch-Korpus
  discovery_stage_claims:
  - mhg
  disposition: added
  resource_id: corpus-badw-mhg
  disposition_reason: Add corpus-badw-mhg as the separately published and maintained
    Mittelhochdeutsch-Korpus. Canonical repository metadata and documentation directly
    establish Middle High German scope, corpus size, annotations, a mutable working
    version, and public browse/download access. It is not merged by title with corpus-mwb-textarchiv
    or dictionary-mwb. ReM documents incorporation of MiGraKo material, but the reviewed
    sources do not directly establish release-level identity or the extent of later
    BAdW improvements, so neither a duplicate disposition nor a structured overlap
    is asserted.
  evidence_gaps:
  - The reviewed canonical sources do not directly equate the current maintained BAdW
    Mittelhochdeutsch-Korpus publication with the exact MiGraKo material incorporated
    into corpus-rem, and they do not establish how post-project improvements compare
    release by release; no duplicate or structured overlap is asserted.
  - No canonical source establishes identity or a structured overlap with retained
    corpus-mwb-textarchiv or any other retained corpus. The shared Middle High German
    wording is not used as identity evidence; dictionary-mwb remains a different resource
    category and project component.
  - No exact release date or currently latest fixed-edition branch was established.
    The proposed version represents only the mutable arbeitsfassung reported as the
    repository default branch.
  - No direct statement establishes model-training, original-data-redistribution,
    processed-data-redistribution, or trained-weight-publication permission; all four
    remain unclear despite the CC BY-SA 4.0 label.
