evidence:
  - id: evidence-rnntagger-homepage
    source_url: https://www.cis.uni-muenchen.de/~schmid/tools/RNNTagger/
    accessed_on: 2026-08-11
    source_kind: project_homepage
    quotation:
      status: known
      value: "The RNNTagger is a tool for annotating text with part-of-speech and lemma information. It comes with pretrained parameter files for over 50 modern and historical languages. RNNTagger was implemented in Python using the PyTorch library."
    note:
      status: known
      value: The page lists Early New High German and Middle High German among the supported historical languages and documents the 1.5.0 ZIP download, installation requirements, command-line example, output example, and citation.
    publication_id:
      status: known
      value: pub-rnntagger-schmid-2019
    archived_url:
      status: not_applicable
  - id: evidence-rnntagger-license
    source_url: https://www.cis.uni-muenchen.de/~schmid/tools/RNNTagger/Tagger-Licence
    accessed_on: 2026-08-11
    source_kind: license_or_terms
    quotation:
      status: known
      value: "You can freely use the RNNTagger software for evaluation, research and teaching purposes. Any other usage of the system (in particular for commercial purposes) requires a commercial license. You are not allowed to distribute the RNNTagger software to other persons without written permission."
    note:
      status: known
      value: The terms expressly address software use and software redistribution, but do not separately identify the pretrained parameter files as models or address model training, processed data, or publication of trained weights.
    publication_id:
      status: not_applicable
    archived_url:
      status: not_applicable
  - id: evidence-rnntagger-publication
    source_url: https://api.crossref.org/works/10.1145/3322905.3322915
    accessed_on: 2026-08-11
    source_kind: catalog_record
    quotation:
      status: known
      value: "Deep Learning-Based Morphological Taggers and Lemmatizers for Annotating Historical Texts"
    note:
      status: known
      value: Crossref identifies the ACM proceedings article, author Helmut Schmid, publication date 2019-05-08, pages 133–137, and DOI 10.1145/3322905.3322915.
    publication_id:
      status: known
      value: pub-rnntagger-schmid-2019
    archived_url:
      status: not_applicable
