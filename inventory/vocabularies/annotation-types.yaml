schema_version: 1.0.0
vocabulary:
  id: annotation_task
  label: Annotation task
  description: Approved controlled values for annotation task in HistGerm.
terms:
  - id: constituency
    label: Constituency
    description: Encodes phrase-structure or constituency syntax.
    aliases:
      - constituent_syntax
    status: active
    introduced_in: 1.0.0
  - id: dating
    label: Dating
    description: Assigns a date, range, period, or dating label to a scoped unit.
    aliases:
      - date
    status: active
    introduced_in: 1.0.0
  - id: dependencies
    label: Dependencies
    description: Encodes directed syntactic dependency relations.
    aliases:
      - dependency_syntax
      - dependency_parsing
    status: active
    introduced_in: 1.0.0
  - id: lemma
    label: Lemma
    description: Links a unit to a canonical lexical lemma.
    aliases:
      - lemmatization
    status: active
    introduced_in: 1.0.0
  - id: morphology
    label: Morphology
    description: Assigns inflectional or derivational analyses/features.
    aliases:
      - morphological_features
    status: active
    introduced_in: 1.0.0
  - id: named_entities
    label: Named entities
    description: Marks and optionally classifies named entities.
    aliases:
      - ner
    status: active
    introduced_in: 1.0.0
  - id: normalization
    label: Normalization
    description: Links a historical form/span to an editorial or linguistic normalized form.
    aliases:
      - spelling_normalization
    status: active
    introduced_in: 1.0.0
  - id: pos
    label: Part of speech
    description: Assigns a part-of-speech category.
    aliases:
      - part_of_speech
    status: active
    introduced_in: 1.0.0
  - id: sentence_segmentation
    label: Sentence segmentation
    description: Defines sentence boundaries.
    aliases:
      - sentences
    status: active
    introduced_in: 1.0.0
  - id: tokenization
    label: Tokenization
    description: Defines token boundaries or token units.
    aliases: []
    status: active
    introduced_in: 1.0.0
