schema_version: 1.0.0
vocabulary:
  id: annotation_production_method
  label: Annotation production method
  description: Approved controlled values for annotation production method in HistGerm.
terms:
  - id: automatic
    label: Automatic
    description: Produced automatically.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: automatic_then_corrected
    label: Automatic then corrected
    description: Automatic output followed by human correction.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: converted
    label: Converted
    description: Mechanically mapped from another existing annotation scheme.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: manual
    label: Manual
    description: Produced manually.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: manual_then_adjudicated
    label: Manual then adjudicated
    description: Independent or staged manual annotation with adjudication.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: mixed
    label: Mixed
    description: Multiple documented methods apply and cannot be separated by layer.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: projected
    label: Projected
    description: Transferred from aligned or linked data.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: rule_based
    label: Rule-based
    description: Produced by documented deterministic/rule-based processing.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: unknown
    label: Unknown
    description: The production method is not established.
    aliases: []
    status: active
    introduced_in: 1.0.0
