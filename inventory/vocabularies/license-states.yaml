schema_version: 1.0.0
vocabulary:
  id: license_status
  label: License status
  description: Approved controlled values for license status in HistGerm.
terms:
  - id: declared_custom
    label: Declared custom terms
    description: Project-specific license or terms are supplied.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: declared_standard
    label: Declared standard license
    description: A recognized license and version are explicitly named.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: multiple
    label: Multiple licenses
    description: Different files, components, layers, or code/data artifacts have different stated licenses.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: no_license_declared
    label: No license declared
    description: A canonical source is available but states no license, or its repository contains no applicable license declaration.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: not_applicable
    label: Not applicable
    description: No licensable distribution/artifact exists in this context.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: not_publicly_available
    label: Not publicly available
    description: License information may exist but is not public.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: unknown
    label: Unknown
    description: License status has not been established.
    aliases: []
    status: active
    introduced_in: 1.0.0
