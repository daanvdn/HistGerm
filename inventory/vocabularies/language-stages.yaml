schema_version: 1.0.0
vocabulary:
  id: language_stage
  label: Language stages
  description: Approved controlled values for language stages in HistGerm.
terms:
  - id: enhg
    label: Early New High German
    description: The transitional historical High German stage in HistGerm conventionally oriented from approximately 1350 to 1650.
    aliases:
      - early_new_high_german
      - frühneuhochdeutsch
      - fruehneuhochdeutsch
      - fnhd
    status: active
    introduced_in: 1.0.0
    abbreviation: ENHG
    recommended_range:
      earliest_year: 1350
      latest_year: 1650
      qualifier: approximately
      interpretation: orientation_only
    boundary_caveat: Interoperability orientation only; scholarship may use other endpoints or subdivisions and change was gradual and regionally uneven.
    caveats:
      - Scholarship may use different endpoints or subdivisions.
      - Linguistic and writing-practice changes were gradual and uneven.
      - Early New High German does not imply modern standard orthography.
      - Composition, witness, print, normalization, and annotation dates remain distinct.
    evidence:
      - id: evidence-enhg-canonical-range
        source_url: https://www.linguistics.rub.de/ref/
        accessed_on: '2026-08-11'
        source_kind: project_documentation
        source_title: Referenzkorpus Frühneuhochdeutsch project page
        quotation: Referenzkorpus Frühneuhochdeutsch ... Texte des Frühneuhochdeutschen (1350–1650)
        note: Canonical ReF documentation explicitly defines its Early New High German corpus as 1350–1650.
    claims:
      /description:
        - evidence-enhg-canonical-range
      /recommended_range/earliest_year:
        - evidence-enhg-canonical-range
      /recommended_range/latest_year:
        - evidence-enhg-canonical-range
  - id: mhg
    label: Middle High German
    description: The conventional middle stage of High German in HistGerm, oriented approximately from 1050 to 1350.
    aliases:
      - mittelhochdeutsch
      - mhd
    status: active
    introduced_in: 1.0.0
    abbreviation: MHG
    recommended_range:
      earliest_year: 1050
      latest_year: 1350
      qualifier: approximately
      interpretation: orientation_only
    boundary_caveat: Conventional orientation only; gradual linguistic change and regional, textual, and editorial classifications may differ.
    caveats:
      - Middle High German comprises regional and textual varieties.
      - The boundaries reflect gradual change.
      - Boundary-spanning material may receive multiple stage assignments.
      - Distinguish work, witness, transcription, and normalization.
    evidence:
      - id: evidence-mhg-canonical-range
        source_url: https://www.linguistics.rub.de/rem/
        accessed_on: '2026-08-11'
        source_kind: project_documentation
        source_title: Referenzkorpus Mittelhochdeutsch project page
        quotation: Referenzkorpus Mittelhochdeutsch ... Texte des Mittelhochdeutschen (1050–1350)
        note: Canonical ReM documentation explicitly defines its Middle High German corpus as 1050–1350.
    claims:
      /description:
        - evidence-mhg-canonical-range
      /recommended_range/earliest_year:
        - evidence-mhg-canonical-range
      /recommended_range/latest_year:
        - evidence-mhg-canonical-range
  - id: ohg
    label: Old High German
    description: The earliest historically attested High German language stage in HistGerm's initial scope, conventionally oriented from the beginning of substantial German-language written transmission around 750 to approximately 1050.
    aliases:
      - althochdeutsch
      - ahd
    status: active
    introduced_in: 1.0.0
    abbreviation: OHG
    recommended_range:
      earliest_year: 750
      latest_year: 1050
      qualifier: approximately
      interpretation: orientation_only
    boundary_caveat: Orientation only, not an exact inclusive interval; written transmission, regional variation, and boundary classifications remain defeasible.
    caveats:
      - The start reflects surviving written transmission, not the beginning of spoken varieties.
      - High German does not mean a uniform supraregional standard.
      - Old Saxon or Old Low German is not automatically Old High German.
      - Composition, witness, copy, and edition dates remain distinct.
      - Preserve source classifications and certainty near 1050.
    evidence:
      - id: evidence-ohg-canonical-range
        source_url: https://www.deutschdiachrondigital.de/rea/projekt/
        accessed_on: '2026-08-11'
        source_kind: project_documentation
        source_title: Referenzkorpus Altdeutsch project description
        quotation: Referenzkorpus Altdeutsch (750-1050) ... vom Beginn der kontinuierlichen schriftlichen Überlieferung um 750 bis etwa 1050
        note: Canonical DDD/REA project documentation explicitly names 750–1050 and continuous written transmission from around 750 to about 1050. REA includes Old High German and Old Saxon monuments; the dates are used only as a defeasible OHG orientation.
    claims:
      /description:
        - evidence-ohg-canonical-range
      /recommended_range/earliest_year:
        - evidence-ohg-canonical-range
      /recommended_range/latest_year:
        - evidence-ohg-canonical-range
