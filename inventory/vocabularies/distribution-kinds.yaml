schema_version: 1.0.0
vocabulary:
  id: distribution_kind
  label: Distribution kind
  description: Approved controlled values for distribution kind in HistGerm.
terms:
  - id: api
    label: API
    description: Data or functionality delivered through a documented API.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: dataset_repository
    label: Dataset repository
    description: A distribution hosted by a dataset service.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: model_repository
    label: Model repository
    description: A model/software distribution hosted by a model service.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: on_request
    label: On-request distribution
    description: A defined package supplied only after a request.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: package_registry
    label: Package registry
    description: A package from a language or operating-system registry.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: physical_or_offline
    label: Physical or offline distribution
    description: Media or access not delivered through a public network endpoint.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: project_download
    label: Project download
    description: Files distributed directly by a project site.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: query_interface
    label: Query interface
    description: Interactive search/browse access without an asserted download API.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: repository_release
    label: Repository release
    description: A tagged or released artifact in a source repository.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: source_repository
    label: Source repository
    description: Access through a version-control repository without a distinct release artifact.
    aliases: []
    status: active
    introduced_in: 1.0.0
