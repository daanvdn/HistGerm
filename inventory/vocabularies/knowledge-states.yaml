schema_version: 1.0.0
vocabulary:
  id: knowledge_state
  label: Knowledge state
  description: States whether a factual value is known, unknown, inapplicable, or not publicly disclosed.
terms:
  - id: known
    label: Known
    description: A non-empty, evidence-ready value is supplied.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: not_applicable
    label: Not applicable
    description: The field does not apply to this entity or context.
    aliases:
      - n_a
      - na
    status: active
    introduced_in: 1.0.0
  - id: not_publicly_available
    label: Not publicly available
    description: A value may exist, but it is not disclosed in public evidence.
    aliases:
      - not_public
      - undisclosed
    status: active
    introduced_in: 1.0.0
  - id: unknown
    label: Unknown
    description: The value has not been established from suitable evidence.
    aliases:
      - not_known
    status: active
    introduced_in: 1.0.0
