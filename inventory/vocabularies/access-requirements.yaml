schema_version: 1.0.0
vocabulary:
  id: access_requirement
  label: Access requirement
  description: Approved controlled values for access requirement in HistGerm.
terms:
  - id: account
    label: Account
    description: An account is required; stronger authentication is not established.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: authentication
    label: Authentication
    description: Authentication beyond merely having an account is required.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: click_through_agreement
    label: Click-through agreement
    description: Access requires accepting displayed terms.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: negotiated_agreement
    label: Negotiated agreement
    description: Access requires an individually or institutionally negotiated/signed agreement.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: none
    label: None documented
    description: No authentication, agreement, or approval requirement is documented.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: not_applicable
    label: Not applicable
    description: No access process exists for the distribution.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: unknown
    label: Unknown
    description: Requirements are not established.
    aliases: []
    status: active
    introduced_in: 1.0.0
