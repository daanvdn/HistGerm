schema_version: 1.0.0
vocabulary:
  id: resource_category
  label: Resource category
  description: Approved controlled values for resource category in HistGerm.
terms:
  - id: corpus
    label: Corpus
    description: A machine-readable collection of texts, raw or annotated.
    aliases:
      - text_corpus
    status: active
    introduced_in: 1.0.0
  - id: dictionary
    label: Dictionary
    description: A lexicographic resource organized as dictionary entries.
    aliases:
      - digital_dictionary
    status: active
    introduced_in: 1.0.0
  - id: lemmatizer
    label: Lemmatizer
    description: Software or a model assigning lemmas.
    aliases: []
    status: active
    introduced_in: 1.0.0
  - id: lexicon
    label: Lexicon
    description: A structured lexical inventory not adequately described as a dictionary.
    aliases:
      - lexical_resource
    status: active
    introduced_in: 1.0.0
  - id: morphological_tagger
    label: Morphological tagger
    description: Software or a model assigning morphological analyses or features.
    aliases:
      - morph_tagger
    status: active
    introduced_in: 1.0.0
  - id: pos_tagger
    label: POS tagger
    description: Software or a model assigning part-of-speech labels.
    aliases:
      - part_of_speech_tagger
    status: active
    introduced_in: 1.0.0
  - id: syntactic_parser
    label: Syntactic parser
    description: Software or a model producing constituency or dependency structure.
    aliases:
      - parser
    status: active
    introduced_in: 1.0.0
